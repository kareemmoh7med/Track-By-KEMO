<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الإدارة | Taqssem Groups</title>
<style>

  :root { --ink:#172b4d;--muted:#6b7890;--line:#e3e9f2;--brand:#3157d5;--brand-dark:#2344b3;--green:#11845b;--red:#c84343; }
  * { box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
  body { min-height:100vh;padding:32px 20px;color:var(--ink);background:radial-gradient(ellipse at 8% 0,#e0e9ff 0,transparent 30%),#f4f7fc; }
  .container { width:min(100%,980px);margin:0 auto; }
  .topbar { display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px; }
  h1 { color:var(--ink);font-size:26px;letter-spacing:-.4px; }
  .subtitle { color:var(--muted);font-size:14px;margin-top:6px; }
  .box { background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,28px);box-shadow:0 12px 34px rgba(28,49,90,.06);margin-bottom:18px; }
  #loginBox { max-width:430px;margin:9vh auto; }
  .login-mark { display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#edf2ff;font-size:24px;margin-bottom:16px; }
  input { width:100%;min-height:48px;padding:12px 14px;border:1px solid #dce4f0;border-radius:11px;background:#fbfcff;font-size:15px;margin-bottom:15px;direction:ltr;text-align:left; }
  input:focus { border-color:var(--brand);outline:0;box-shadow:0 0 0 4px rgba(49,87,213,.11);background:#fff; }
  button { min-height:42px;padding:10px 16px;background:var(--brand);color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s; }
  button:hover { background:var(--brand-dark);transform:translateY(-1px); } button:disabled { opacity:.6;cursor:wait;transform:none; }
  .top-actions { display:flex;align-items:center;gap:10px; }
  .student-link { display:inline-flex;align-items:center;min-height:42px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;color:#40516c;text-decoration:none;font-size:14px;font-weight:700;background:#fff;transition:all .15s; }
  .student-link:hover { color:var(--brand);border-color:#cbd7f4;background:#f7f9ff; }
  .logout { background:#edf1f7;color:#40516c; }.logout:hover { background:#e0e6ef; }
  .btn-approve { background:#e7f6ef;color:#13704f;margin-inline-start:6px; }.btn-approve:hover { background:#d4efdf; }
  .btn-reject { background:#fff0ef;color:#b13d38;margin-inline-start:6px; }.btn-reject:hover { background:#ffe1df; }
  .btn-save { background:var(--brand); }
  h2 { color:var(--ink);font-size:18px;margin-bottom:18px; }
  label { display:block;margin-bottom:7px;color:#53627a;font-size:13px;font-weight:700; }
  .field-grid { display:grid;grid-template-columns:1fr 1fr;gap:0 16px; }
  .req { border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;background:#fff; }
  .req-info { font-size:14px;line-height:1.9;color:#64728a; }.req-info b { color:var(--ink);font-size:15px; }
  .badge { display:inline-block;padding:3px 10px;border-radius:30px;font-size:12px;font-weight:700;margin-inline-start:8px; }
  .pending { background:#fff4d8;color:#946000; }.approved { background:#e5f5ed;color:#15714d; }.rejected { background:#fff0ef;color:#aa3935; }
  .empty { text-align:center;color:var(--muted);padding:25px 14px;line-height:1.8; }
  #msg,#msg2 { padding:12px 14px;border-radius:10px;margin-bottom:15px;text-align:center;display:none;font-size:14px;line-height:1.6; }
  .ok { background:#e8f6ef;color:#176b4c;display:block!important; }.err { background:#fff0ef;color:#a53632;display:block!important; }
  @media(max-width:620px) { body { padding:20px 14px; }.topbar { align-items:flex-start; }.topbar h1 { font-size:22px; }.top-actions { flex-wrap:wrap;justify-content:flex-end; }.student-link { padding:9px 11px; }.field-grid { grid-template-columns:1fr; }.req { align-items:flex-start; }.logout { padding:9px 12px; } }

</style>
</head>
<body>
<div class="container">

  <!-- شاشة تسجيل الدخول -->
  <div id="loginBox" class="box">
    <div class="login-mark" aria-hidden="true">🔐</div>
    <h1>دخول الإدارة</h1>
    <p class="subtitle" style="margin-bottom:22px">سجل الدخول لإدارة الروابط ومراجعة الطلبات</p>
    <div id="msg" role="status" aria-live="polite"></div>
    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com" required>
      <label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required>
      <button id="loginBtn" type="submit" style="width:100%">دخول</button>
    </form>
  </div>

  <!-- لوحة التحكم -->
  <div id="panel" hidden>
    <header class="topbar"><div><h1>لوحة الإدارة</h1><p class="subtitle">إدارة روابط المجموعات ومتابعة طلبات الطلاب</p></div><div class="top-actions"><a class="student-link" href="index.html">← صفحة الطالب</a><button id="logoutBtn" class="logout">تسجيل الخروج</button></div></header>
    <div id="msg2" role="status" aria-live="polite"></div>

    <div class="box">
      <h2>روابط المجموعات</h2>
      <div class="field-grid"><div><label for="swLink">رابط مجموعة Software</label><input id="swLink" type="url" placeholder="https://chat.whatsapp.com/..."></div>
      <div><label for="netLink">رابط مجموعة Network</label><input id="netLink" type="url" placeholder="https://chat.whatsapp.com/..."></div></div>
      <button id="saveLinks" class="btn-save">حفظ الروابط</button>
    </div>

    <div class="box">
      <h2>طلبات الطلاب</h2>
      <div id="requestsList"><p class="empty">جاري التحميل...</p></div>
    </div>
  </div>
</div>

<script type="module">
  // ⬇️⬇️ ضع إعدادات firebaseConfig بتاعتك هنا (نفس اللي في صفحة الطالب) ⬇️⬇️
   const firebaseConfig = {
    apiKey: "AIzaSyAky9Ig-e-DAZM0BNzJ9XEv1-gHfb-wjTU",
    authDomain: "taqssem-groups.firebaseapp.com",
    projectId: "taqssem-groups",
    storageBucket: "taqssem-groups.firebasestorage.app",
    messagingSenderId: "293858870250",
    appId: "1:293858870250:web:77e76bbe133e020454e893"
  };



  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const loginBox = document.getElementById('loginBox');
  const panel = document.getElementById('panel');
  const msg = document.getElementById('msg');
  const msg2 = document.getElementById('msg2');
  let stopListeningToRequests = null;

  function showMsg(el, text, isErr) {
    el.textContent = text;
    el.className = isErr ? 'err' : 'ok';
  }
  const friendlyError = (error) => error?.code === 'permission-denied' ? 'ليس لديك صلاحية لهذا الإجراء. راجع قواعد Firestore.' : 'تعذر الاتصال بالخدمة. تحقق من الإنترنت وإعدادات Firebase ثم حاول مجددًا.';

  // تسجيل الدخول
  document.getElementById('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      showMsg(msg, e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' ? 'بيانات الدخول غير صحيحة، حاول مرة أخرى.' : friendlyError(e), true);
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

  // متابعة حالة الدخول
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      loginBox.hidden = true;
      panel.hidden = false;
      loadSettings();
      if (!stopListeningToRequests) stopListeningToRequests = listenToRequests();
    } else {
      loginBox.hidden = false;
      panel.hidden = true;
      if (stopListeningToRequests) { stopListeningToRequests(); stopListeningToRequests = null; }
    }
  });

  // تحميل الروابط الحالية
  async function loadSettings() {
    try {
      const snap = await getDoc(doc(db, 'settings', 'general'));
      if (snap.exists()) {
        document.getElementById('swLink').value = snap.data().softwareGroupLink || '';
        document.getElementById('netLink').value = snap.data().networkGroupLink || '';
      }
    } catch (e) { showMsg(msg2, friendlyError(e), true); }
  }

  // حفظ الروابط
  document.getElementById('saveLinks').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    const swLink = document.getElementById('swLink').value.trim();
    const netLink = document.getElementById('netLink').value.trim();
    if ([swLink, netLink].some((url) => url && !/^https:\/\//i.test(url))) { showMsg(msg2, 'أدخل روابط تبدأ بـ https:// فقط.', true); return; }
    button.disabled = true; button.textContent = 'جارٍ الحفظ...';
    try {
      await setDoc(doc(db, 'settings', 'general'), { softwareGroupLink: swLink, networkGroupLink: netLink, allowAutoShow: true }, { merge: true });
      showMsg(msg2, 'تم حفظ الروابط بنجاح.', false);
      setTimeout(() => msg2.className = '', 3500);
    } catch (e) { showMsg(msg2, friendlyError(e), true); }
    finally { button.disabled = false; button.textContent = 'حفظ الروابط'; }
  });

  // عرض الطلبات لحظيًا
  function listenToRequests() {
    const q = query(collection(db, 'requests'), orderBy('createdAt', 'desc'));
    return onSnapshot(q, (snapshot) => {
      const list = document.getElementById('requestsList');
      if (snapshot.empty) {
        list.innerHTML = '<p class="empty">مفيش طلبات لحد دلوقتي</p>';
        return;
      }
      list.innerHTML = '';
      snapshot.forEach((docSnap) => {
        const r = docSnap.data();
        const statusTxt = { pending: '⏳ مستني', approved: '✅ مقبول', rejected: '❌ مرفوض' }[r.status] || r.status;
        const div = document.createElement('div');
        div.className = 'req';
        const info = document.createElement('div'); info.className = 'req-info';
        const name = document.createElement('b'); name.textContent = r.whatsappName || 'بدون اسم واتساب';
        const badge = document.createElement('span'); badge.className = `badge ${['pending','approved','rejected'].includes(r.status) ? r.status : ''}`; badge.textContent = statusTxt;
        const phone = document.createElement('div'); phone.dir = 'rtl'; phone.textContent = `📱 ${r.phone || '-'}`;
        const track = document.createElement('div'); track.textContent = `🎓 الشعبة: ${r.track === 'network' ? 'Network' : 'Software'}`;
        const date = document.createElement('div'); date.textContent = `🕐 ${r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleString('ar-EG') : ''}`;
        info.append(name, badge, document.createElement('br'), phone, track, date);
        div.appendChild(info);
        if (r.status === 'pending') {
          const actions = document.createElement('div');
          const approve = document.createElement('button'); approve.className = 'btn-approve'; approve.textContent = 'قبول'; approve.addEventListener('click', () => updateStatus(docSnap.id, 'approved', approve));
          const reject = document.createElement('button'); reject.className = 'btn-reject'; reject.textContent = 'رفض'; reject.addEventListener('click', () => updateStatus(docSnap.id, 'rejected', reject));
          actions.append(approve, reject); div.appendChild(actions);
        }
        list.appendChild(div);
      });
    }, (error) => { document.getElementById('requestsList').innerHTML = `<p class="empty">${friendlyError(error)}</p>`; });
  }

  async function updateStatus(id, status, button) {
    button.disabled = true;
    try { await updateDoc(doc(db, 'requests', id), { status }); }
    catch (e) { showMsg(msg2, friendlyError(e), true); button.disabled = false; }
  }
</script>
</body>
</html>
